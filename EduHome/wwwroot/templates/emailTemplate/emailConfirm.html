<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            background-color: #0d0d0d;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 15px;
            background: #222;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            text-align: center;
            color: #fff;
        }

            .container::before {
                content: '';
                position: absolute;
                top: -30%;
                left: -30%;
                width: 200%;
                height: 200%;
                background: radial-gradient(circle, rgba(0, 255, 255, 0.2) 10%, rgba(0, 255, 255, 0) 60%);
                animation: pulse 6s infinite;
                z-index: 0;
            }

            .container img {
                width: 100px;
                margin-bottom: 20px;
            }

            .container > * {
                position: relative;
                z-index: 1;
            }

        h1 {
            color: #00ffff;
            margin-bottom: 20px;
            font-size: 36px;
            font-weight: 700;
            animation: neon 1.5s ease-in-out infinite alternate;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            margin: 10px 0;
            color: #00ff00; 
        }

        .otp-code {
            display: inline-block;
            padding: 15px 25px;
            border: 2px solid #00ffff;
            border-radius: 8px;
            color: #00ffff;
            font-size: 28px;
            font-weight: 700;
            background-color: #222;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            animation: bounce 1.5s infinite;
        }

        .footer {
            margin-top: 40px;
            font-size: 16px;
            color: #b0b0b0;
        }

            .footer a {
                color: #00ffff;
                text-decoration: none;
                font-weight: 500;
            }

                .footer a:hover {
                    text-decoration: underline;
                }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.2);
                opacity: 0.7;
            }

            100% {
                transform: scale(1);
                opacity: 0.5;
            }
        }

        @keyframes neon {
            0% {
                text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff, 0 0 15px #00ffff, 0 0 20px #00ffff, 0 0 25px #00ffff;
            }

            100% {
                text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff, 0 0 40px #00ffff, 0 0 50px #00ffff;
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://thumbs.dreamstime.com/b/otp-one-time-password-step-authentication-data-protection-internet-security-concept-otp-one-time-password-step-authentication-data-254434939.jpg" alt="Company Logo">
        <h1>OTP Verification</h1>
        <p>Hello <strong>{{username}},</strong></p>
        <p>Your OTP code is:</p>
        <p class="otp-code">{{otpCode}}</p>
        <p>Please enter this code on the website to verify your email address.</p>
        <p>If you did not request this code, please ignore this email.</p>
        <div class="footer">
            <p>Thank you for using our service.</p>
            <p><a href="https://localhost:7146/">Unsubscribe</a> | <a href="https://localhost:7146/contact">Contact Support</a></p>
        </div>
    </div>
</body>
</html>
